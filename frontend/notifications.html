<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngiSphere | Notifications Center</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script>
        (function() {
            const t = localStorage.getItem('engisphere-theme') || 'dark';
            document.documentElement.classList.add(t + '-theme');
        })();
    </script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-soft: #eef4ff;
            --sidebar: #ffffff;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-soft: #e2e8f0;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #dbeafe;
            --shadow-premium: 0 12px 30px rgba(15, 23, 42, 0.06);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 80px;
        }

        body.dark-theme {
            --bg-main: #020617;
            --bg-soft: #071225;
            --sidebar: #0f172a;
            --card-bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-soft: rgba(255, 255, 255, 0.08);
            --shadow-premium: 0 20px 40px rgba(0, 0, 0, 0.28);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            transition: var(--transition);
        }

        /* Sidebar Styles (Simplified Copy from index) */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar);
            border-right: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            padding: 28px 18px;
            z-index: 1000;
            position: fixed;
            height: 100vh;
            transition: var(--transition);
        }
        body.sidebar-collapsed .sidebar { width: var(--sidebar-collapsed-width); padding: 28px 12px; }

        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; text-decoration: none; }
        .logo-icon { width: 38px; height: 38px; border-radius: 18px; background: var(--primary); color: #fff; display: grid; place-items: center; }
        .logo-text { font-size: 20px; font-weight: 800; color: var(--text-main); }
        body.sidebar-collapsed .logo-text, body.sidebar-collapsed .nav-link span { display: none; }

        .nav-link {
            display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px;
            color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 13px; margin-bottom: 4px;
        }
        .nav-link:hover { background: var(--primary-soft); color: var(--primary); }
        .nav-link.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white !important; }

        .main {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 28px 34px 80px;
            width: calc(100% - var(--sidebar-width));
            transition: var(--transition);
        }
        body.sidebar-collapsed .main { margin-left: var(--sidebar-collapsed-width); width: calc(100% - var(--sidebar-collapsed-width)); }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: 800; }

        .btn {
            padding: 10px 16px; border-radius: 10px; font-size: 12px; font-weight: 700;
            cursor: pointer; border: 1px solid var(--border-soft); background: var(--card-bg);
            color: var(--text-main); transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:hover { border-color: var(--primary); color: var(--primary); }
        .btn-primary { background: var(--primary); color: #fff; border: none; }
        .btn-primary:hover { background: var(--primary-dark); color: #fff; }

        /* Notification Layout */
        .notif-center {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            height: calc(100vh - 160px);
        }

        .notif-list-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-premium);
        }

        .panel-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-header h3 { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }

        .notif-items {
            flex: 1;
            overflow-y: auto;
        }

        .notif-center-item {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-soft);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            gap: 14px;
            position: relative;
        }
        .notif-center-item:hover { background: var(--bg-soft); }
        .notif-center-item.active { background: var(--primary-soft); border-left: 4px solid var(--primary); padding-left: 16px; }
        
        .notif-center-icon {
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            background: var(--bg-soft); color: var(--primary);
        }

        .notif-center-content { flex: 1; min-width: 0; }
        .notif-center-title { font-size: 13px; font-weight: 800; margin-bottom: 4px; color: var(--text-main); }
        .notif-center-msg { font-size: 12px; color: var(--text-muted); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .notif-center-meta { font-size: 11px; color: var(--text-muted); margin-top: 6px; font-weight: 600; }

        .unread-indicator {
            width: 8px; height: 8px; border-radius: 50%; background: var(--primary);
            position: absolute; top: 20px; right: 20px;
        }

        .notif-detail-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-premium);
        }

        .detail-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-muted);
        }
        .detail-empty i { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }

        .detail-header { margin-bottom: 30px; }
        .detail-tag {
            display: inline-flex; padding: 4px 10px; border-radius: 6px;
            font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 16px;
        }
        .detail-header h2 { font-size: 28px; font-weight: 900; margin-bottom: 8px; letter-spacing: -0.5px; }
        .detail-time { font-size: 13px; color: var(--text-muted); font-weight: 600; }

        .detail-body {
            flex: 1;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 40px;
        }

        .detail-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            padding: 24px;
            background: var(--bg-soft);
            border-radius: 16px;
        }
        .meta-item label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        .meta-item span { font-size: 14px; font-weight: 700; color: var(--text-main); }

        .detail-actions {
            display: flex;
            gap: 12px;
            border-top: 1px solid var(--border-soft);
            padding-top: 30px;
        }

        @media (max-width: 1024px) {
            .notif-center { grid-template-columns: 1fr; }
            .notif-detail-panel { display: none; }
            .notif-detail-panel.show-mobile { display: flex; position: fixed; inset: 0; z-index: 2000; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <a href="index.html" class="logo">
            <div class="logo-icon"><i class="fas fa-cube"></i></div>
            <div class="logo-text">ENGI<span>SPHERE</span></div>
        </a>

        <nav style="flex: 1;">
            <a href="home.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="index.html" class="nav-link">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="solutions.html" class="nav-link">
                <i class="fas fa-satellite"></i>
                <span>Geospatial Radar</span>
            </a>
            <a href="ai_chat.html" class="nav-link">
                <i class="fas fa-brain"></i>
                <span>AI EngiBot</span>
            </a>
            <a href="project_details.html" class="nav-link">
                <i class="fas fa-folder-open"></i>
                <span>Project Details</span>
            </a>
            <a href="team_access.html" class="nav-link">
                <i class="fas fa-users-gear"></i>
                <span>Team Access</span>
            </a>
            <a href="reports.html" class="nav-link">
                <i class="fas fa-file-invoice"></i>
                <span>Reports</span>
            </a>
        </nav>
        
        <a href="#" onclick="logout(); return false;" class="nav-link exit-link" style="margin-top: auto; color: #ef4444;">
            <i class="fas fa-power-off"></i>
            <span>Exit System</span>
        </a>
    </aside>

    <main class="main">
        <div class="header">
            <div>
                <h1>Notifications Center</h1>
                <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Review project alerts, AI risk updates, and system events.</p>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn" onclick="markAllRead()">Mark all read</button>
                <a href="index.html" class="btn btn-primary">Dashboard</a>
            </div>
        </div>

        <div class="notif-center">
            <div class="notif-list-panel">
                <div class="panel-header">
                    <h3>Alerts & Activity</h3>
                    <span id="unreadCount" style="font-size: 11px; font-weight: 800; color: var(--primary);">0 UNREAD</span>
                </div>
                <div class="notif-items" id="notifList">
                    <!-- Items rendered here -->
                </div>
            </div>

            <div class="notif-detail-panel" id="detailPanel">
                <div class="detail-empty">
                    <i class="fas fa-bell"></i>
                    <p>Select a notification from the list to view more details.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentNotifId = null;

        function init() {
            renderList();
            
            // Check for ID in URL
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (id) {
                selectNotification(id);
            }
        }

        function renderList() {
            const list = document.getElementById('notifList');
            const notifications = window.EngiSphereNotifications.getNotifications();
            const unreadCount = window.EngiSphereNotifications.getUnreadNotifications().length;
            
            document.getElementById('unreadCount').innerText = `${unreadCount} UNREAD`;

            if (notifications.length === 0) {
                list.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted);">No notifications available.</div>';
                return;
            }

            list.innerHTML = notifications.map(n => {
                const isUnread = !n.read;
                const isActive = n.id === currentNotifId;
                const time = window.EngiSphereNotifications.relativeTime(n.createdAt);
                
                return `
                    <div class="notif-center-item ${isActive ? 'active' : ''}" onclick="selectNotification('${n.id}')">
                        <div class="notif-center-icon">
                            <i class="fas ${getIcon(n.type)}"></i>
                        </div>
                        <div class="notif-center-content">
                            <div class="notif-center-title">${n.title}</div>
                            <div class="notif-center-msg">${n.message}</div>
                            <div class="notif-center-meta">${time} ${n.projectTitle ? '· ' + n.projectTitle : ''}</div>
                        </div>
                        ${isUnread ? '<div class="unread-indicator"></div>' : ''}
                    </div>
                `;
            }).join('');
        }

        function getIcon(type) {
            const map = {
                high_risk_alert: "fa-radiation",
                risk_update: "fa-shield-virus",
                system: "fa-microchip",
                ai: "fa-brain",
                progress_update: "fa-chart-line",
                status_update: "fa-circle-info"
            };
            return map[type] || "fa-bell";
        }

        function getSeverityColor(severity) {
            const map = {
                high: "#fee2e2",
                warning: "#fef3c7",
                success: "#d1fae5",
                info: "#dbeafe"
            };
            const textMap = {
                high: "#ef4444",
                warning: "#f59e0b",
                success: "#10b981",
                info: "#2563eb"
            };
            return { bg: map[severity] || "#f1f5f9", text: textMap[severity] || "#64748b" };
        }

        function selectNotification(id) {
            currentNotifId = id;
            window.EngiSphereNotifications.markNotificationAsRead(id);
            renderList();
            renderDetail(id);
        }

        function renderDetail(id) {
            const panel = document.getElementById('detailPanel');
            const notif = window.EngiSphereNotifications.getNotifications().find(n => n.id === id);
            
            if (!notif) return;

            const sev = getSeverityColor(notif.severity);
            const date = new Date(notif.createdAt).toLocaleString();

            panel.innerHTML = `
                <div class="detail-header">
                    <span class="detail-tag" style="background:${sev.bg}; color:${sev.text}">${notif.type.replace('_', ' ')}</span>
                    <h2>${notif.title}</h2>
                    <div class="detail-time">${date}</div>
                </div>
                <div class="detail-body">
                    ${notif.message}
                </div>
                <div class="detail-meta-grid">
                    <div class="meta-item">
                        <label>Related Project</label>
                        <span>${notif.projectTitle || 'N/A'}</span>
                    </div>
                    <div class="meta-item">
                        <label>Reference ID</label>
                        <span>${notif.projectId ? 'PRJ-' + String(notif.projectId).padStart(4, '0') : 'System'}</span>
                    </div>
                    ${notif.riskScore ? `
                        <div class="meta-item">
                            <label>Risk Score</label>
                            <span style="color:#ef4444">${notif.riskScore}/100</span>
                        </div>
                    ` : ''}
                    <div class="meta-item">
                        <label>Category</label>
                        <span>${notif.type}</span>
                    </div>
                </div>
                <div class="detail-actions">
                    ${notif.projectId ? `
                        <a href="project-details.html?projectId=${notif.projectId}" class="btn btn-primary">Open Related Project</a>
                        <a href="ai-radar.html?projectId=${notif.projectId}" class="btn">Run AI Radar</a>
                    ` : ''}
                    <a href="index.html" class="btn">Back to Dashboard</a>
                </div>
            `;
        }

        function openProject(target, id) {
            const action = target === 'ai-radar' ? 'radar' : 'project';
            window.location.href = `index.html?open=${action}&projectId=${id}`;
        }

        function markAllRead() {
            window.EngiSphereNotifications.markAllNotificationsAsRead();
            renderList();
            if (currentNotifId) renderDetail(currentNotifId);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
