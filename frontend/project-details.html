<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngiSphere | Project Details</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/project_progress.js"></script>
    <script>
        (function() {
            const t = localStorage.getItem('engisphere-theme') || 'dark';
            document.documentElement.classList.add(t + '-theme');
        })();
    </script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-soft: #eef4ff;
            --sidebar: #ffffff;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-soft: #e2e8f0;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #dbeafe;
            --shadow-premium: 0 12px 30px rgba(15, 23, 42, 0.06);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 80px;
        }

        body.dark-theme {
            --bg-main: #020617;
            --bg-soft: #071225;
            --sidebar: #0f172a;
            --card-bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-soft: rgba(255, 255, 255, 0.08);
            --shadow-premium: 0 20px 40px rgba(0, 0, 0, 0.28);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            transition: var(--transition);
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar);
            border-right: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            padding: 28px 18px;
            z-index: 1000;
            position: fixed;
            height: 100vh;
            transition: var(--transition);
        }
        body.sidebar-collapsed .sidebar { width: var(--sidebar-collapsed-width); padding: 28px 12px; }

        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; text-decoration: none; }
        .logo-icon { width: 38px; height: 38px; border-radius: 18px; background: var(--primary); color: #fff; display: grid; place-items: center; }
        .logo-text { font-size: 20px; font-weight: 800; color: var(--text-main); }
        body.sidebar-collapsed .logo-text, body.sidebar-collapsed .nav-link span { display: none; }

        .nav-link {
            display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px;
            color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 13px; margin-bottom: 4px;
        }
        .nav-link:hover { background: var(--primary-soft); color: var(--primary); }
        .nav-link.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white !important; }

        .main {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 28px 34px 80px;
            width: calc(100% - var(--sidebar-width));
            transition: var(--transition);
        }
        body.sidebar-collapsed .main { margin-left: var(--sidebar-collapsed-width); width: calc(100% - var(--sidebar-collapsed-width)); }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: 800; }

        .btn {
            padding: 10px 16px; border-radius: 10px; font-size: 12px; font-weight: 700;
            cursor: pointer; border: 1px solid var(--border-soft); background: var(--card-bg);
            color: var(--text-main); transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:hover { border-color: var(--primary); color: var(--primary); }
        .btn-primary { background: var(--primary); color: #fff; border: none; }
        .btn-primary:hover { background: var(--primary-dark); color: #fff; }

        /* Detail Layout */
        .detail-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow-premium);
            margin-bottom: 24px;
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-soft);
        }

        .project-title h2 { font-size: 32px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 8px; }
        .project-id-badge { font-size: 13px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .status-pill {
            padding: 6px 14px; border-radius: 99px; font-size: 11px; font-weight: 800; text-transform: uppercase;
        }
        .status-active { background: #d1fae5; color: #065f46; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-progress { background: #dbeafe; color: #1e40af; }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .detail-item {
            padding: 20px;
            background: var(--bg-soft);
            border-radius: 16px;
        }
        .detail-item label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
        .detail-item .value { font-size: 15px; font-weight: 700; color: var(--text-main); }

        .description-box {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--border-soft);
        }
        .description-box h3 { font-size: 16px; font-weight: 800; margin-bottom: 16px; }
        .description-box p { font-size: 15px; color: var(--text-main); line-height: 1.6; }

        .radar-summary {
            background: linear-gradient(135deg, #ede9fe, #dbeafe);
            padding: 24px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 40px;
        }
        body.dark-theme .radar-summary { background: linear-gradient(135deg, #1e1b4b, #1e293b); }

        .radar-text h4 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
        .radar-text p { font-size: 13px; opacity: 0.8; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <a href="index.html" class="logo">
            <div class="logo-icon"><i class="fas fa-cube"></i></div>
            <div class="logo-text">ENGI<span>SPHERE</span></div>
        </a>

        <nav style="flex: 1;">
            <a href="home.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="index.html" class="nav-link">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="solutions.html" class="nav-link">
                <i class="fas fa-satellite"></i>
                <span>Geospatial Radar</span>
            </a>
            <a href="project_details.html" class="nav-link active">
                <i class="fas fa-folder-open"></i>
                <span>Project Details</span>
            </a>
        </nav>
        
        <a href="index.html" class="nav-link">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Dashboard</span>
        </a>
    </aside>

    <main class="main">
        <div class="header">
            <div>
                <h1 id="pageHeading">Project Profile</h1>
                <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Comprehensive operational overview and risk analysis.</p>
            </div>
            <div style="display: flex; gap: 12px;">
                <a href="index.html" class="btn">Back to Dashboard</a>
                <a href="#" id="radarBtnTop" class="btn btn-primary">Run AI Radar</a>
            </div>
        </div>

        <div class="detail-container" id="detailRoot">
            <div class="card" style="text-align: center; padding: 100px 40px;">
                <i class="fas fa-circle-notch fa-spin" style="font-size: 40px; color: var(--primary); margin-bottom: 20px;"></i>
                <p>Syncing project intelligence...</p>
            </div>
        </div>
    </main>

    <script>
        function init() {
            const params = new URLSearchParams(window.location.search);
            const projectId = params.get('projectId');
            
            if (!projectId) {
                showError("No project ID provided.");
                return;
            }

            const projects = JSON.parse(localStorage.getItem('engisphere_projects') || '[]');
            let project = projects.find(p => String(p.id) === String(projectId));

            // Fallback for demo
            if (!project) {
                const demoData = [
                    { id: 1, title: "Dubai Smart Bridge Operations", status: "Active", location: "Dubai, UAE", type: "Infrastructure", risk_score: 12, progress: 85, description: "Advanced IoT-enabled structural monitoring system for urban transit." },
                    { id: 2, title: "Riyadh Metro Expansion Phase 2", status: "In Progress", location: "Riyadh, KSA", type: "Transport", risk_score: 45, progress: 32, description: "Large-scale civil engineering and signaling integration project." },
                    { id: 3, title: "Doha Energy Control Center", status: "Pending", location: "Doha, Qatar", type: "Energy", risk_score: 68, progress: 5, description: "Critical infrastructure upgrade for regional power grid management." }
                ];
                project = demoData.find(p => String(p.id) === String(projectId));
            }

            if (!project) {
                showError("Project not found in system.");
                return;
            }

            // Merge local progress if available
            if (window.EngiSphereProgress) {
                project = window.EngiSphereProgress.mergeProjectProgress(project);
            }

            renderProject(project);
        }

        function renderProject(p) {
            const root = document.getElementById('detailRoot');
            const radarUrl = `ai-radar.html?projectId=${p.id}`;
            document.getElementById('radarBtnTop').href = radarUrl;
            document.getElementById('pageHeading').innerText = p.title;

            const statusClass = p.status.toLowerCase().includes('active') ? 'status-active' : 
                              p.status.toLowerCase().includes('pending') ? 'status-pending' : 'status-progress';

            root.innerHTML = `
                <div class="card">
                    <div class="project-header">
                        <div class="project-title">
                            <div class="project-id-badge">PRJ-${String(p.id).padStart(4, '0')}</div>
                            <h2>${p.title}</h2>
                        </div>
                        <span class="status-pill ${statusClass}">${p.status}</span>
                    </div>

                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>Location</label>
                            <div class="value">${p.location || 'Global Operations'}</div>
                        </div>
                        <div class="detail-item">
                            <label>Project Type</label>
                            <div class="value">${p.type}</div>
                        </div>
                        <div class="detail-item">
                            <label>Risk Score</label>
                            <div class="value" style="color: ${p.risk_score > 60 ? '#ef4444' : p.risk_score > 30 ? '#f59e0b' : '#10b981'}">
                                ${p.risk_score}/100
                            </div>
                        </div>
                        <div class="detail-item">
                            <label>Operational Progress</label>
                            <div class="value">${p.progress}%</div>
                        </div>
                    </div>

                    <div class="description-box">
                        <h3>Executive Summary</h3>
                        <p>${p.description || 'No detailed description available for this project. General operational monitoring is active.'}</p>
                    </div>

                    <div class="radar-summary">
                        <div class="radar-text">
                            <h4>AI Risk Radar Ready</h4>
                            <p>Generate a deep-dive analysis of project health, cost realism, and schedule stability.</p>
                        </div>
                        <a href="${radarUrl}" class="btn btn-primary">
                            <i class="fas fa-brain"></i>
                            Analyze Now
                        </a>
                    </div>
                </div>
            `;
        }

        function showError(msg) {
            document.getElementById('detailRoot').innerHTML = `
                <div class="card" style="text-align: center; padding: 60px 40px;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 40px; color: #ef4444; margin-bottom: 20px;"></i>
                    <h3 style="margin-bottom: 10px;">${msg}</h3>
                    <p style="color: var(--text-muted); margin-bottom: 24px;">Please check the URL or return to the dashboard.</p>
                    <a href="index.html" class="btn btn-primary">Back to Dashboard</a>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
