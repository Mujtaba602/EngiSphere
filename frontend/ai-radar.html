<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngiSphere | AI Radar Analysis</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script>
        (function() {
            const t = localStorage.getItem('engisphere-theme') || 'dark';
            document.documentElement.classList.add(t + '-theme');
        })();
    </script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-soft: #eef4ff;
            --sidebar: #ffffff;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-soft: #e2e8f0;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #dbeafe;
            --shadow-premium: 0 12px 30px rgba(15, 23, 42, 0.06);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 80px;
            --ai-purple: #8b5cf6;
            --ai-purple-soft: rgba(139, 92, 246, 0.1);
        }

        body.dark-theme {
            --bg-main: #020617;
            --bg-soft: #071225;
            --sidebar: #0f172a;
            --card-bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-soft: rgba(255, 255, 255, 0.08);
            --shadow-premium: 0 20px 40px rgba(0, 0, 0, 0.28);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            transition: var(--transition);
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar);
            border-right: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            padding: 28px 18px;
            z-index: 1000;
            position: fixed;
            height: 100vh;
            transition: var(--transition);
        }
        body.sidebar-collapsed .sidebar { width: var(--sidebar-collapsed-width); padding: 28px 12px; }

        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; text-decoration: none; }
        .logo-icon { width: 38px; height: 38px; border-radius: 18px; background: var(--ai-purple); color: #fff; display: grid; place-items: center; }
        .logo-text { font-size: 20px; font-weight: 800; color: var(--text-main); }
        body.sidebar-collapsed .logo-text, body.sidebar-collapsed .nav-link span { display: none; }

        .nav-link {
            display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px;
            color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 13px; margin-bottom: 4px;
        }
        .nav-link:hover { background: var(--ai-purple-soft); color: var(--ai-purple); }
        .nav-link.active { background: linear-gradient(135deg, var(--ai-purple), #7c3aed); color: white !important; }

        .main {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 28px 34px 80px;
            width: calc(100% - var(--sidebar-width));
            transition: var(--transition);
        }
        body.sidebar-collapsed .main { margin-left: var(--sidebar-collapsed-width); width: calc(100% - var(--sidebar-collapsed-width)); }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: 800; }

        .btn {
            padding: 10px 16px; border-radius: 10px; font-size: 12px; font-weight: 700;
            cursor: pointer; border: 1px solid var(--border-soft); background: var(--card-bg);
            color: var(--text-main); transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:hover { border-color: var(--ai-purple); color: var(--ai-purple); }
        .btn-purple { background: var(--ai-purple); color: #fff; border: none; }
        .btn-purple:hover { background: #7c3aed; color: #fff; }

        .radar-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow-premium);
            margin-bottom: 24px;
        }

        .risk-overview {
            display: flex;
            gap: 30px;
            align-items: center;
            background: var(--bg-soft);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 40px;
        }

        .risk-gauge {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 10px solid var(--border-soft);
            background: var(--card-bg);
        }
        .risk-gauge .score { font-size: 32px; font-weight: 900; }
        .risk-gauge label { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .analysis-card {
            padding: 24px;
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            text-align: center;
        }
        .analysis-card .label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
        .analysis-card .value { font-size: 18px; font-weight: 800; color: var(--text-main); }

        .insight-box {
            padding: 30px;
            background: rgba(139, 92, 246, 0.05);
            border-left: 4px solid var(--ai-purple);
            border-radius: 0 16px 16px 0;
            margin-top: 40px;
        }
        .insight-box h3 { font-size: 16px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .insight-box p { font-size: 14px; line-height: 1.6; color: var(--text-main); opacity: 0.9; }

        .confidence-pills {
            display: flex; gap: 12px; margin-top: 24px;
        }
        .pill { padding: 4px 12px; border-radius: 99px; font-size: 10px; font-weight: 800; text-transform: uppercase; background: var(--bg-soft); color: var(--text-muted); }
        .pill.active { background: var(--ai-purple-soft); color: var(--ai-purple); border: 1px solid var(--ai-purple); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <a href="index.html" class="logo">
            <div class="logo-icon"><i class="fas fa-brain"></i></div>
            <div class="logo-text">AI<span>RADAR</span></div>
        </a>

        <nav style="flex: 1;">
            <a href="index.html" class="nav-link">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="solutions.html" class="nav-link">
                <i class="fas fa-satellite"></i>
                <span>Geospatial Radar</span>
            </a>
            <a href="#" class="nav-link active">
                <i class="fas fa-microchip"></i>
                <span>AI Risk Analysis</span>
            </a>
        </nav>
        
        <a href="index.html" class="nav-link">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Dashboard</span>
        </a>
    </aside>

    <main class="main">
        <div class="header">
            <div>
                <h1 id="projectTitle">AI Radar Engine</h1>
                <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Real-time risk assessment and predictive feasibility scoring.</p>
            </div>
            <div style="display: flex; gap: 12px;">
                <a href="index.html" class="btn">Back to Dashboard</a>
                <a href="#" id="detailsBtn" class="btn">View Project Details</a>
            </div>
        </div>

        <div class="radar-container" id="radarRoot">
            <div class="card" style="text-align: center; padding: 100px 40px;">
                <i class="fas fa-brain fa-spin" style="font-size: 40px; color: var(--ai-purple); margin-bottom: 20px;"></i>
                <p>Engaging predictive engines...</p>
            </div>
        </div>
    </main>

    <script>
        function init() {
            const params = new URLSearchParams(window.location.search);
            const projectId = params.get('projectId');
            
            if (!projectId) {
                showError("No project ID provided for analysis.");
                return;
            }

            const projects = JSON.parse(localStorage.getItem('engisphere_projects') || '[]');
            const project = projects.find(p => String(p.id) === String(projectId));

            if (!project) {
                showError("Project telemetry not found.");
                return;
            }

            document.getElementById('projectTitle').innerText = project.title;
            document.getElementById('detailsBtn').href = `project-details.html?projectId=${project.id}`;

            renderAnalysis(project);
        }

        function renderAnalysis(p) {
            const root = document.getElementById('radarRoot');
            const score = p.risk_score || 0;
            const status = score > 60 ? 'At Risk' : score > 30 ? 'Watch' : 'Healthy';
            const color = score > 60 ? '#ef4444' : score > 30 ? '#f59e0b' : '#10b981';

            root.innerHTML = `
                <div class="card">
                    <div class="risk-overview">
                        <div class="risk-gauge" style="border-color: ${color}44;">
                            <div class="score" style="color: ${color}">${score}</div>
                            <label>Risk Score</label>
                        </div>
                        <div>
                            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 8px;">Analysis Status: <span style="color:${color}">${status}</span></h2>
                            <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5; max-width: 500px;">
                                EngiSphere AI has processed the latest project telemetry. This project is currently exhibiting <strong>${status.toLowerCase()}</strong> characteristics based on budget, schedule, and technical complexity factors.
                            </p>
                            <div class="confidence-pills">
                                <span class="pill active">AI Confidence: High</span>
                                <span class="pill">Real-time Sync</span>
                                <span class="pill">ML Model v2.4</span>
                            </div>
                        </div>
                    </div>

                    <div class="analysis-grid">
                        <div class="analysis-card">
                            <div class="label">Schedule Realism</div>
                            <div class="value" style="color: ${score > 50 ? '#ef4444' : '#10b981'}">
                                ${score > 50 ? 'Aggressive' : 'Balanced'}
                            </div>
                        </div>
                        <div class="analysis-card">
                            <div class="label">Budget Stability</div>
                            <div class="value" style="color: ${score > 70 ? '#ef4444' : '#10b981'}">
                                ${score > 70 ? 'Volatile' : 'Stable'}
                            </div>
                        </div>
                        <div class="analysis-card">
                            <div class="label">Technical Depth</div>
                            <div class="value">${p.type === 'Software' ? 'Complex' : 'Moderate'}</div>
                        </div>
                        <div class="analysis-card">
                            <div class="label">Data Readiness</div>
                            <div class="value">94%</div>
                        </div>
                    </div>

                    <div class="insight-box">
                        <h3><i class="fas fa-lightbulb"></i> Strategic AI Insights</h3>
                        <p>
                            Based on the current trajectory, the project has a ${Math.round(100 - score)}% probability of meeting its Q3 milestones without intervention. 
                            <strong>Recommendation:</strong> Perform a deep-dive review of stakeholder communication logs and verify third-party vendor readiness for the upcoming integration phase.
                        </p>
                    </div>

                    <div style="margin-top: 40px; text-align: center;">
                        <a href="index.html" class="btn">Back to Dashboard</a>
                        <a href="project-details.html?projectId=${p.id}" class="btn btn-purple" style="margin-left: 12px;">View Comprehensive Profile</a>
                    </div>
                </div>
            `;
        }

        function showError(msg) {
            document.getElementById('radarRoot').innerHTML = `
                <div class="card" style="text-align: center; padding: 60px 40px;">
                    <i class="fas fa-microchip" style="font-size: 40px; color: #ef4444; margin-bottom: 20px;"></i>
                    <h3 style="margin-bottom: 10px;">${msg}</h3>
                    <p style="color: var(--text-muted); margin-bottom: 24px;">AI Analysis requires a valid project context.</p>
                    <a href="index.html" class="btn btn-purple">Back to Dashboard</a>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
