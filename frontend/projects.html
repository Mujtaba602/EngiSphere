<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects | EngiSphere</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #3b82f6; --dark: #020617; --sidebar: #01040f; --card: rgba(15, 23, 42, 0.7); --border: rgba(255, 255, 255, 0.08); }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--dark); color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding-top: 20px; }
        .sidebar .logo { font-size: 22px; font-weight: 800; padding: 0 25px 25px; cursor: pointer; }
        .sidebar li { padding: 15px 25px; cursor: pointer; display: flex; align-items: center; gap: 15px; color: #94a3b8; transition: 0.3s; }
        .sidebar li.active { color: #fff; background: rgba(59, 130, 246, 0.1); border-left: 4px solid var(--p); }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background-image: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05), transparent 80%); }
        .container { padding: 50px; max-width: 1100px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        
        .project-card { 
            background: var(--card); border: 1px solid var(--border); border-radius: 20px; 
            padding: 25px; margin-bottom: 20px; display: flex; justify-content: space-between; 
            align-items: center; transition: 0.4s; backdrop-filter: blur(10px);
        }
        .project-card:hover { transform: scale(1.02); border-color: var(--p); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .status-badge { padding: 6px 14px; border-radius: 100px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .btn-view { background: var(--p); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo" onclick="window.location.href='home.html'"><i class="fas fa-drafting-compass" style="color: var(--p);"></i> ENGISPHERE</div>
        <ul>
            <li onclick="window.location.href='home.html'"><i class="fas fa-home"></i> Home</li>
            <li onclick="window.location.href='index.html'"><i class="fas fa-th-large"></i> Command Center</li>
            <li class="active"><i class="fas fa-project-diagram"></i> My Projects</li>
            <li onclick="window.location.href='ai_chat.html'"><i class="fas fa-robot"></i> AI EngiBot</li>
            <li onclick="logout()" style="margin-top: auto;"><i class="fas fa-sign-out-alt"></i> Logout</li>
        </ul>
    </div>

    <div class="main-content">
        <div class="container">
            <h1 style="font-size: 40px; font-weight: 800; margin-bottom: 40px;">Project Portfolio</h1>
            <div id="projectList">
                </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("access_token");
        async function loadProjects() {
            const res = await fetch("http://127.0.0.1:8000/projects/", { headers: { "Authorization": `Bearer ${token}` } });
            const projects = await res.json();
            const container = document.getElementById('projectList');
            container.innerHTML = projects.map(p => `
                <div class="project-card">
                    <div style="display:flex; align-items:center; gap:20px;">
                        <div style="width:50px; height:50px; background:rgba(59,130,246,0.1); border-radius:12px; display:flex; justify-content:center; align-items:center; color:var(--p);">
                            <i class="fas fa-building"></i>
                        </div>
                        <div>
                            <h3 style="margin:0;">${p.title}</h3>
                            <p style="margin:0; color:#94a3b8; font-size:12px;">${p.location} | ${p.project_type}</p>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:20px;">
                        <span class="status-badge" style="background:rgba(16,185,129,0.1); color:#10b981;">${p.status}</span>
                        <button class="btn-view" onclick="window.location.href='project_details.html?id=${p.id}'">Open Intel</button>
                    </div>
                </div>
            `).join('');
        }
        function logout() { localStorage.clear(); window.location.href = "login.html"; }
        window.onload = loadProjects;
    </script>
</body>
</html>
